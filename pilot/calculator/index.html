<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор</title>
<style>
  :root { --bg: #14161a; --card: #1e2126; --fg: #eef1f5; --muted: #8b93a1; --accent: #4f8cff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .calc { width: 320px; padding: 16px; background: var(--card); border-radius: 16px; }
  .screen { padding: 12px 8px 16px; text-align: right; }
  #history { min-height: 20px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  #display {
    width: 100%; border: 0; background: none; color: var(--fg); text-align: right;
    font: 600 40px/1.2 ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums;
    outline: none;
  }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button {
    padding: 14px 0; border: 0; border-radius: 10px; cursor: pointer;
    background: #2a2f37; color: var(--fg); font-size: 18px; font-variant-numeric: tabular-nums;
  }
  button:hover { background: #333944; }
  .op { background: #363d49; }
  .eq { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="calc">
  <div class="screen">
    <div id="history"></div>
    <input id="display" value="0" readonly aria-label="Дисплей">
  </div>
  <div class="keys" id="keys">
    <button data-k="C">C</button>
    <button data-k="%" class="op">%</button>
    <button data-k="/" class="op">÷</button>
    <button data-k="*" class="op">×</button>

    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button data-k="-" class="op">−</button>

    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button data-k="+" class="op">+</button>

    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button data-k="=" class="eq">=</button>

    <button data-k="0">0</button>
    <button data-k=".">.</button>
    <button data-k="±" title="Знак">±</button>
  </div>
</div>
<script src="calculator.js?v=285970c6e9"></script>
<script>
  const calc = new Calculator();
  const display = document.getElementById("display");
  const history = document.getElementById("history");

  const render = () => {
    display.value = calc.display();
    history.textContent = calc.historyText();
  };

  document.getElementById("keys").addEventListener("click", (e) => {
    const k = e.target.dataset.k;
    if (!k) return;
    calc.press(k);
    render();
  });

  render();
</script>
</body>
</html>
