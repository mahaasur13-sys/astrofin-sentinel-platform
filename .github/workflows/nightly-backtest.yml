name: Nightly Backtest (Real Mode)

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run nightly backtests
        run: pytest tests/test_backtest_runner.py tests/test_backtest_mode_comparison.py tests/test_backtest_real_agents.py tests/test_vedic_backtest.py -v --tb=short
        env:
          AGENT_RUN_REAL: 1
