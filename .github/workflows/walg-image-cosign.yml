name: WAL-G image Cosign (keyless)

on:
  push:
    branches: [release/v1.0.0]
    paths:
      - ".github/workflows/walg-image-cosign.yml"
      - "deploy/docker/docker-compose.wal-g.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sign-verify:
    name: Keyless sign + verify wal-g-pg digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pin the exact digest (never sign a floating tag).
      IMAGE: ghcr.io/mahaasur13-sys/wal-g-pg:v3.0.6-uid999@sha256:89be9fb2008d67d9895bfbb642f561caa4db20f4b0ed436b1ea51565d1553c83
    steps:
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
      - name: Sign image (keyless, GitHub OIDC)
        run: |
          cosign sign --yes "${IMAGE}"
      - name: Verify signature (this repo/workflow identity only)
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github.com/mahaasur13-sys/astrofin-sentinel-platform/.github/workflows/walg-image-cosign.yml@refs/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}"
