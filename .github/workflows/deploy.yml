name: CD — Build, Sign, Deploy

# Continuous Delivery pipeline.
#
# Flow:
#   1. push tag v*.*.*  -> build + sign + push image to GHCR
#   2. deploy-staging   -> kubectl apply to staging cluster (environment: staging)
#   3. smoke-test       -> curl /healthz on staging service
#   4. deploy-prod      -> kubectl apply to prod cluster (environment: production, requires approval)
#
# Required secrets (configure at repo or environment level):
#   - KUBE_CONFIG_STAGING (base64-encoded kubeconfig for staging)
#   - KUBE_CONFIG_PROD     (base64-encoded kubeconfig for production)
#   - STAGING_HEALTH_URL   (e.g. https://staging.astrofin.example/healthz)
#   - PROD_HEALTH_URL      (e.g. https://astrofin.example/healthz)
#
# Signing is keyless (Cosign + GitHub OIDC): no COSIGN_PRIVATE_KEY /
# COSIGN_PASSWORD, no cosign.key written to the runner. Requires id-token: write.
#
# Image registry: ghcr.io/mahaasur13-sys/astrofin-sentinel-platform
#
# Tag strategy (never :latest):
#   - ${VERSION}  (from git tag, e.g. v1.2.3)
#   - <git-sha>   (immutable full commit SHA)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version tag (e.g. v1.2.3). Skips staging + prod auto-deploy.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write   # for cosign keyless (optional, see below)
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build, sign, push
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build, Sign & Push
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image:   ${{ steps.meta.outputs.image }}
      digest:  ${{ steps.build.outputs.digest }}
      sbom:    ${{ steps.sbom.outputs.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME##*/}"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}"      >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "::group::Image metadata"
          echo "version : ${VERSION}"
          echo "image   : ${IMAGE}"
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (multi-arch manifest, multi-tag)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Never :latest (floating). Semver + immutable git SHA only.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=AstroFin Sentinel Platform
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          provenance: true
          sbom: true

      # -------------------------- SBOM --------------------------
      - name: Generate SBOM (syft)
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          artifact-name: astrofin-sbom.spdx.json

      # ------------------------- Cosign sign -------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign image (keyless, GitHub OIDC)
        env:
          IMAGE:  ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Sign the pushed repo digest (steps.build.outputs.digest), not a
          # floating tag and not a local /tmp manifest hash. Keyless via the
          # GitHub Actions OIDC token — no cosign.key, no COSIGN_PRIVATE_KEY.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature (this workflow identity only)
        env:
          IMAGE:  ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github.com/mahaasur13-sys/astrofin-sentinel-platform/.github/workflows/deploy.yml@refs/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}@${DIGEST}"

  # ---------------------------------------------------------------------------
  # 2. Deploy to staging
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy → staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_HEALTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4

      - name: Render manifests with new image tag
        env:
          IMAGE:   ${{ needs.build-and-push.outputs.image }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          set -euo pipefail
          # In-place substitution of the image tag in deploy/k8s/deployment.yaml
          sed -i.bak \
            -E "s|(image:.*ghcr\.io/mahaasur13-sys/astrofin-sentinel-platform:).*|\1${VERSION}|g" \
            deploy/k8s/deployment.yaml
          rm -f deploy/k8s/deployment.yaml.bak
          echo "Patched image tag:"
          grep '^[[:space:]]*image:' deploy/k8s/deployment.yaml | head -5

      - name: Apply manifests
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          set -euo pipefail
          echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
          export KUBECONFIG="${PWD}/kubeconfig"
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -n astrofin-sentinel -f deploy/k8s/

      - name: Wait for rollout
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          set -euo pipefail
          echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
          export KUBECONFIG="${PWD}/kubeconfig"
          kubectl rollout status deployment/astrofin-sentinel-web \
            -n astrofin-sentinel --timeout=5m

  # ---------------------------------------------------------------------------
  # 3. Smoke test
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke test (staging /healthz)
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck
        env:
          URL: ${{ vars.STAGING_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${URL}" ]; then
            echo "::error::STAGING_HEALTH_URL is not set."
            exit 1
          fi
          for i in {1..10}; do
            code=$(curl -sS -o /tmp/hc.body -w "%{http_code}" "${URL}" || echo "000")
            echo "attempt ${i}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              echo "✅ staging healthz OK"
              cat /tmp/hc.body
              exit 0
            fi
            sleep 5
          done
          echo "::error::staging healthcheck never returned 200"
          cat /tmp/hc.body || true
          exit 1

  # ---------------------------------------------------------------------------
  # 4. Deploy to production (gated)
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy → production
    needs: [build-and-push, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_HEALTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4

      - name: Render manifests with new image tag
        env:
          IMAGE:   ${{ needs.build-and-push.outputs.image }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          set -euo pipefail
          sed -i.bak \
            -E "s|(image:.*ghcr\.io/mahaasur13-sys/astrofin-sentinel-platform:).*|\1${VERSION}|g" \
            deploy/k8s/deployment.yaml
          rm -f deploy/k8s/deployment.yaml.bak

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Verify cosign signature on production image (keyless)
        env:
          IMAGE:   ${{ needs.build-and-push.outputs.image }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github.com/mahaasur13-sys/astrofin-sentinel-platform/.github/workflows/deploy.yml@refs/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}:${VERSION}" \
            || (echo "::error::Image signature verification FAILED — refusing to deploy."; exit 1)

      - name: Apply manifests
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          set -euo pipefail
          echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
          export KUBECONFIG="${PWD}/kubeconfig"
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -n astrofin-sentinel -f deploy/k8s/

      - name: Wait for rollout
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          set -euo pipefail
          echo "${KUBECONFIG_B64}" | base64 -d > kubeconfig
          export KUBECONFIG="${PWD}/kubeconfig"
          kubectl rollout status deployment/astrofin-sentinel-web \
            -n astrofin-sentinel --timeout=10m

      - name: Post-deploy healthcheck
        env:
          URL: ${{ vars.PROD_HEALTH_URL }}
        run: |
          set -euo pipefail
          for i in {1..15}; do
            code=$(curl -sS -o /tmp/hc.body -w "%{http_code}" "${URL}" || echo "000")
            if [ "${code}" = "200" ]; then
              echo "✅ production healthz OK"
              exit 0
            fi
            sleep 4
          done
          echo "::error::production healthcheck never returned 200"
          exit 1