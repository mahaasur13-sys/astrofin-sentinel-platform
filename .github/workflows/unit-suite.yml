name: Council Unit Suite

on:
  pull_request:
    branches: [main, master, develop, release/**]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_DEFAULT: "3.12"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  action-pins:
    name: Action SHA pins guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Validate action pins
        run: |
          bash scripts/ci_validate_action_pins.sh
      - name: Validate metrics bind guard (BIND_ALL requires token)
        run: |
          bash scripts/ci_validate_metrics_bind.sh
      - name: Prod go gate (orchestrates restore/user/image/metrics/pins/deploy)
        run: |
          bash scripts/ci_validate_prod_gate.sh

  council-suite:
    name: Council/http/settings/thompson unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: pytest council suite
        run: |
          python -m pytest -q --tb=short --no-header -p no:cacheprovider \
            tests/test_astro_council_agent.py \
            tests/test_synthesis_voter.py \
            tests/test_okx_candle_url.py \
            tests/test_fundamental_agent_fetch.py \
            tests/test_settings.py \
            tests/test_thompson_astro_pool.py \
            tests/test_metrics_bind.py
