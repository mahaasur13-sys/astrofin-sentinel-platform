name: Quality Gate

permissions:
  contents: read

on:
  pull_request:
    branches: [ master, develop ]

# No `paths:` filter on purpose. A required status check that never gets
# created leaves every PR outside agents/core/web/scripts/docs green by
# default. Without the filter the job always reports; it stays cheap on
# unrelated PRs because ruff and per-agent validation exit early when no
# lint-scope files changed.

# Quality gate is a **blocking** job for changes in the agents/ tree.
# It enforces: linter, per-agent validator, aggregate package coverage,
# and a "did you touch docs?" warning.
#
# KI-125 fix: ruff now runs only on files changed in the PR (not the whole
# tree). Previously it surfaced 60+ pre-existing BLE001 errors in master
# and made every PR red, regardless of what the PR touched. See
# docs/KNOWN_ISSUES.md (KI-125).

env:
  PYTHON_VERSION: '3.12'
  COVERAGE_FAIL_UNDER: '45'

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Install
        run: pip install --break-system-packages -e ".[dev,web]"

      - name: Detect changes in agents/_impl/, core/, orchestration/, and web/
        id: changed
        run: |
          {
            echo "changed_files<<EOF"
            git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -E '^(agents/_impl/|core/|orchestration/|web/)' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          cat <<< "${{ steps.changed.outputs.changed_files }}"

      - name: Lint changed files (KI-125)
        # Run ruff on the intersection of "files the PR changed" and
        # "files under lint-scope trees that still exist on disk".
        # Files outside the PR diff are not enforced here — they are
        # addressed as separate cleanup tasks (see ROADMAP).
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --depth=1 origin "${{ github.base_ref }}"
          mapfile -t files < <(
            git diff --name-only "$base"...HEAD \
              | grep -E '\.py$' \
              | grep -E '^(agents/|core/|scripts/|orchestration/|web/|data_room/|api/|monitoring/|trading/|meta_rl/)' || true
          )
          existing=()
          for f in "${files[@]}"; do
            [ -f "$f" ] && existing+=("$f")
          done
          if [ ${#existing[@]} -eq 0 ]; then
            echo "No lint-scope Python files changed in this PR. Skipping ruff."
            exit 0
          fi
          echo "Linting ${#existing[@]} changed Python file(s):"
          printf '  - %s\n' "${existing[@]}"
          ruff check "${existing[@]}" --output-format=github

      - name: Architecture linter
        run: |
          python scripts/architecture_linter.py --fail-on error \
            agents core orchestration web data_room api monitoring trading meta_rl

      - name: Per-agent validation (loop)
        if: steps.changed.outputs.changed_files != ''
        run: |
          set -e
          for f in $(echo "${{ steps.changed.outputs.changed_files }}" | tr ' ' '\n' | grep '^agents/_impl/.*\.py$' || true); do
            echo "::group::Validate $f"
            python scripts/validate_agent.py "$f" --fail-on error
            echo "::endgroup::"
          done

      - name: Setup uv and run coverage
        run: |
          set -eo pipefail
          pip install uv
          uv sync --frozen --extra dev --extra web
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv run python -m pytest tests/ --tb=short \
            --no-header \
            --cov=agents \
            --cov=core \
            --cov=meta_rl \
            --cov=orchestration \
            --cov=trading \
            --cov=web \
            --cov-report=term \
            --cov-report=json:coverage.json \
            --cov-precision=4 \
            --cov-fail-under="$COVERAGE_FAIL_UNDER"

          # Compare raw counts as integers: pytest-cov rounds to its configured
          # precision before comparing with --cov-fail-under.
          uv run python - <<'PY_GATE'
          import json
          import os
          from fractions import Fraction
          from pathlib import Path

          try:
              minimum = Fraction(os.environ["COVERAGE_FAIL_UNDER"])
          except (KeyError, ValueError, ZeroDivisionError) as exc:
              raise SystemExit(f"Invalid coverage threshold: {exc}")
          if not 0 < minimum <= 100:
              raise SystemExit("COVERAGE_FAIL_UNDER must be > 0 and <= 100")

          totals = json.loads(Path("coverage.json").read_text(encoding="utf-8"))["totals"]
          covered, statements = totals["covered_lines"], totals["num_statements"]
          if not isinstance(covered, int) or not isinstance(statements, int):
              raise SystemExit("Coverage counts must be integers")
          if statements <= 0 or not 0 <= covered <= statements:
              raise SystemExit("Coverage counts are invalid or empty")
          if 100 * covered * minimum.denominator < minimum.numerator * statements:
              raise SystemExit(f"Coverage gate failed: {covered}/{statements} < {minimum}%")
          print(f"Coverage gate passed: {covered}/{statements} >= {minimum}% (unrounded)")
          PY_GATE

      - name: Doc-touch warning (informational)
        if: steps.changed.outputs.changed_files != ''
        run: |
          docs_changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(docs/|STATUS\.md|ARCHITECTURE\.md|CONTRIBUTING\.md)' | wc -l)
          impl_changed=$(echo "${{ steps.changed.outputs.changed_files }}" \
            | grep -E '^agents/_impl/' | wc -l)
          if [ "$impl_changed" -gt 0 ] && [ "$docs_changed" -eq 0 ]; then
            echo "::warning file=docs/STATUS.md::You changed agents/_impl/ but did not touch docs/. Please update docs/STATUS.md (and ARCHITECTURE.md if the contract changed)."
          fi
