name: Promtool Monitoring

# Validates the Prometheus rules and the standalone config under deploy/monitoring/.
# Modelled on roma-execution-bridge's promtool-rules job (.github/workflows/ci.yml).

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-progress runs for the same ref on new pushes.
concurrency:
  group: promtool-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promtool-monitoring:
    name: Prometheus rules + config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter lists the PR's changed files through the API, which
      # requires pull-requests: read on top of contents: read.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect monitoring changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            monitoring:
              - 'deploy/monitoring/**'
              - '.github/workflows/promtool-monitoring.yml'
              - '.github/scripts/check-jev-canon-drift.sh'
      - name: Download Prometheus v2.54.1 (sha256-pinned)
        if: steps.filter.outputs.monitoring == 'true'
        run: |
          curl -fsSL -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz
          echo "31715ef65e8a898d0f97c8c08c03b6b9afe485ac84e1698bcfec90fc6e62924f  /tmp/prometheus.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp --strip-components=1
          sudo install -m 0755 /tmp/promtool /usr/local/bin/promtool
      - name: Download yq v4.54.1 (sha256-pinned)
        if: steps.filter.outputs.monitoring == 'true'
        run: |
          curl -fsSL -o /tmp/yq \
            https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
      - name: Download amtool v0.34.1 (sha256-pinned)
        if: steps.filter.outputs.monitoring == 'true'
        run: |
          curl -fsSL -o /tmp/alertmanager.tar.gz \
            https://github.com/prometheus/alertmanager/releases/download/v0.34.1/alertmanager-0.34.1.linux-amd64.tar.gz
          echo "265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8  /tmp/alertmanager.tar.gz" | sha256sum -c -
          tar -xzf /tmp/alertmanager.tar.gz -C /tmp --strip-components=1 alertmanager-0.34.1.linux-amd64/amtool
          sudo install -m 0755 /tmp/amtool /usr/local/bin/amtool
      - name: amtool check-config
        if: steps.filter.outputs.monitoring == 'true'
        run: amtool check-config deploy/monitoring/alertmanager.yml
      - name: promtool check rules
        if: steps.filter.outputs.monitoring == 'true'
        run: |
          promtool check rules \
            deploy/monitoring/alert_rules.yml \
            deploy/monitoring/recording-rules.yml
      - name: ROMA canon drift check (jev-shadow/critical/warning/billing/drill)
        if: steps.filter.outputs.monitoring == 'true'
        run: bash .github/scripts/check-jev-canon-drift.sh
      - name: promtool test rules (ROMA canon Jev cases)
        if: steps.filter.outputs.monitoring == 'true'
        run: |
          # The Jev shadow cases live in ROMA; run them against this repo's copy
          # of the group so a rules edit cannot land without the canon cases
          # passing. The group is re-emitted standalone, with the runbook path
          # restored to its repo-relative form, and the test's rule_files is
          # repointed at that standalone file.
          mkdir -p /tmp/jev-canon-tests
          curl -fsSL -o /tmp/jev-canon-tests/jev-shadow-alerts.test.yml \
            https://raw.githubusercontent.com/mahaasur13-sys/roma-execution-bridge/master/deploy/monitoring/tests/jev-shadow-alerts.test.yml
          yq -o=yaml '[.groups[] | select(.name == "roma-jev-shadow")]' \
            deploy/monitoring/alert_rules.yml \
            | sed 's#https://github.com/mahaasur13-sys/roma-execution-bridge/blob/master/docs/jev-shadow-ops-runbook.md#docs/jev-shadow-ops-runbook.md#' \
            | sed '1i groups:' > /tmp/jev-canon-tests/jev-shadow.rules.yml
          sed -i 's#^  - \.\./alert-rules-roma\.yml#  - ./jev-shadow.rules.yml#' \
            /tmp/jev-canon-tests/jev-shadow-alerts.test.yml
          cd /tmp/jev-canon-tests && promtool test rules jev-shadow-alerts.test.yml
      - name: promtool check config
        if: steps.filter.outputs.monitoring == 'true'
        run: |
          # The tracked config points at absolute host paths (rule_files,
          # password_file) that do not exist on a runner, so validate a
          # rewritten copy and leave the tracked file untouched.
          echo "dummy-ci-password" > /tmp/prom-gc-basic-auth
          sed -e "s#/home/workspace/#${GITHUB_WORKSPACE}/#g" \
              -e "s#/root/.sealed/prom-gc-basic-auth#/tmp/prom-gc-basic-auth#" \
              deploy/monitoring/prometheus-standalone.yml > /tmp/prometheus-standalone.ci.yml
          promtool check config /tmp/prometheus-standalone.ci.yml
      - name: promtool test rules
        if: steps.filter.outputs.monitoring == 'true'
        run: |
          if compgen -G "deploy/monitoring/tests/*.test.yml" > /dev/null; then
            promtool test rules deploy/monitoring/tests/*.test.yml
          else
            echo "no rule unit tests in deploy/monitoring/tests — skipping"
          fi
