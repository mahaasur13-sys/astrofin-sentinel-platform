name: Security

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/architecture_linter.py"
  pull_request:
    branches: [main, master]
  schedule:
    # Mondays 06:00 UTC, after dependabot (which is also Monday).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit medium+ confidence
        run: |
          bandit -r . \
            -ll -ii \
            -x .venv,venv,__pycache__,.git,.pytest_cache,tests,build,dist,.zo_scratch,.STALE* \
            --format json --output bandit-report.json || true
          bandit -r . \
            -ll -ii \
            -x .venv,venv,__pycache__,.git,.pytest_cache,tests,build,dist,.zo_scratch,.STALE* \
            --skip B101 || true
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14
        if: always()

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit
        run: pip-audit --strict --requirement pyproject.toml || true

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3

  safety:
    name: Safety (vulnerability DB)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install safety
        run: pip install safety==3.7.0
      - name: safety scan
        continue-on-error: true
        run: safety scan --file requirements.txt --output json --save-json /tmp/safety.json || true
