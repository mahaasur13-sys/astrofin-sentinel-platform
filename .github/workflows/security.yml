name: Security

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/architecture_linter.py"
  pull_request:
    branches: [main, master]
  schedule:
    # Mondays 06:00 UTC, after dependabot (which is also Monday).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4
      - name: Bandit HIGH (blocking) / medium+ (report)
        run: |
          bandit -r . \
            -ll -ii \
            -x .venv,venv,__pycache__,.git,.pytest_cache,tests,build,dist,.zo_scratch,.STALE* \
            --format json --output bandit-report.json || true
          bandit -r . \
            -lll -ii \
            -x .venv,venv,__pycache__,.git,.pytest_cache,tests,build,dist,.zo_scratch,.STALE* \
            --skip B101
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14
        if: always()

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit uv
      - name: Audit exported lock pins
        # pyproject.toml is not a requirements file; audit the resolved prod pins.
        # --no-deps/--disable-pip: the export is already the full transitive set,
        # so skip pip-audit's throwaway venv + re-resolution against the index.
        run: |
          uv export --frozen --no-hashes --no-emit-project -o /tmp/requirements-audit.txt
          pip-audit --strict --no-deps --disable-pip -r /tmp/requirements-audit.txt

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  safety:
    name: Safety (vulnerability DB)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Install safety
        run: pip install safety==3.7.0
      - name: safety scan
        continue-on-error: true
        run: safety scan --file requirements.txt --output json --save-json /tmp/safety.json
