# ROMA Analytics — agent cordis composition
# Read-only аналитика кодовой базы.
# Только: fs (read-only) + web + ROMA billing read. Без bash, без мутаций.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a ROMA analytics agent. Your working directory is {{cwd}}.
      You can READ files, search the web, and query ROMA Bridge for billing/usage data (mcp__roma__*).
      You CANNOT write files, run bash commands, or mutate any ROMA state.
      NEVER call ROMA API directly — always use mcp__roma__* tools.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 16384

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false
