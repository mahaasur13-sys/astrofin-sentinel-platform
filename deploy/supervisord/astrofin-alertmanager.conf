[program:astrofin-alertmanager]
command=/usr/local/bin/alertmanager --config.file=/home/workspace/deploy/monitoring/alertmanager.yml --storage.path=/home/workspace/deploy/monitoring/am-data --web.listen-address=127.0.0.1:9093 --cluster.listen-address=
directory=/home/workspace
environment=
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
startretries=20
