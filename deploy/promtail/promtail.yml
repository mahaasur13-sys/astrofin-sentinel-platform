# =============================================================================
# Promtail — Log scraper → Loki
# =============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: astrofin-agents
    static_configs:
      - targets:
          - localhost
        labels:
          job: astrofin-agents
          __path__: /var/log/astrofin/*.log

  - job_name: astrofin-system
    static_configs:
      - targets:
          - localhost
        labels:
          job: astrofin-system
          __path__: /var/log/astrofin/system/*.log

  - job_name: astrofin-web
    static_configs:
      - targets:
          - localhost
        labels:
          job: astrofin-web
          __path__: /var/log/astrofin/web/*.log
