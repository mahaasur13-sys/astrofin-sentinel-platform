# =============================================================================
# Monitoring stack для AstroFin Sentinel Platform (staging + local dev).
#
# Использование (любой из вариантов):
#   # Вариант 1: запуск из корня репозитория
#   cd ~/Projects/astrofin-sentinel-platform
#   docker compose -f deploy/docker-compose.monitoring.yml up -d
#
#   # Вариант 2: запуск из каталога deploy/
#   cd ~/Projects/astrofin-sentinel-platform/deploy
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Сервисы:
#   - prometheus    :9050 — сбор метрик
#   - alertmanager  :9053 — маршрутизация алертов
#   - grafana       :9051 — дашборды (admin/admin, сменить на проде)
#   - blackbox      :9115 — healthcheck prober
#   - node-exporter :9100 — host metrics
# =============================================================================

services:

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: astrofin-prometheus
    restart: unless-stopped
    ports:
      - "9050:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # All alerts consolidated in alert_rules.yml (SLO + service + infra)
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: astrofin-alertmanager
    restart: unless-stopped
    ports:
      - "9053:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      # Передаются из .env или CI (НЕ коммитить значения):
      SLACK_WEBHOOK_URL:     ${SLACK_WEBHOOK_URL:-}
      SLACK_WEBHOOK_SLO_URL: ${SLACK_WEBHOOK_SLO_URL:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      SMTP_PASSWORD:         ${SMTP_PASSWORD:-}
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: astrofin-grafana
    restart: unless-stopped
    ports:
      - "9051:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_AUTH_ANONYMOUS_ENABLED:  "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/astrofin-overview.json:ro
      - ./monitoring/grafana/provisioning/dashboards/agent-performance.json:/var/lib/grafana/dashboards/agent-performance.json:ro
      - ./monitoring/grafana/provisioning/dashboards/infrastructure-overview.json:/var/lib/grafana/dashboards/infrastructure-overview.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: astrofin-blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: astrofin-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # ═══════════════════════════════════════════════════════════════════════════
  # Loki — Log aggregation database (Grafana Cloud-compatible API)
  # ═══════════════════════════════════════════════════════════════════════════
  loki:
    image: grafana/loki:3.0.0
    container_name: astrofin-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - loki-wal:/wal
    command: -config.file=/etc/loki/local-config.yaml -target=all
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # Promtail — Log scraper (scrapes /dev/shm/*.log → Loki)
  # ═══════════════════════════════════════════════════════════════════════════
  promtail:
    image: grafana/promtail:3.0.0
    container_name: astrofin-promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /dev/shm:/dev/shm:ro
      - /var/log:/var/log:ro
      - promtail-positions:/tmp
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      LOKI_USER: ${LOKI_USER:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
      ASTROFIN_ENV: ${ASTROFIN_ENV:-production}
      HOSTNAME: ${HOSTNAME:-localhost}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  loki-wal:
  promtail-positions:
