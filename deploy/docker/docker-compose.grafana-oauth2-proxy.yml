# Grafana oauth2-proxy overlay — apply ON TOP of docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.grafana-oauth2-proxy.yml up -d
#
# Loopback-only oauth2-proxy in front of Grafana (UI: http://127.0.0.1:4180).
# Does NOT replace the Grafana Generic OAuth overlay (C6). No IdP service here.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1@sha256:f6a4aa83a27e316114bf79664302b1ffb2cc8ce697fb479273af4feb3fb16fe3  # refresh: docker buildx imagetools inspect quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: astrofinsentinel_oauth2_proxy
    ports:
      - "127.0.0.1:4180:4180"
    environment:
      - "OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID:?OAUTH2_PROXY_CLIENT_ID is required}"
      - "OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET:?OAUTH2_PROXY_CLIENT_SECRET is required}"
      - "OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET is required}"
      - "OAUTH2_PROXY_OIDC_ISSUER_URL=${OAUTH2_PROXY_OIDC_ISSUER_URL:?OAUTH2_PROXY_OIDC_ISSUER_URL is required}"
      - "OAUTH2_PROXY_REDIRECT_URL=${OAUTH2_PROXY_REDIRECT_URL:?OAUTH2_PROXY_REDIRECT_URL is required}"
      - "OAUTH2_PROXY_UPSTREAMS=http://grafana:3000"
      - "OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180"
      - "OAUTH2_PROXY_PROVIDER=oidc"
      - "OAUTH2_PROXY_EMAIL_DOMAINS=${OAUTH2_EMAIL_DOMAINS:?OAUTH2_EMAIL_DOMAINS is required}"
      - "OAUTH2_PROXY_COOKIE_SECURE=false"
      - "OAUTH2_PROXY_COOKIE_SAMESITE=strict"
    depends_on:
      - grafana
    restart: unless-stopped
