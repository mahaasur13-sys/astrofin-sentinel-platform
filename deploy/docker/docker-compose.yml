services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: astrofinsentinel_app
    environment:
      - "DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}"
      - "REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"
      - "LOG_LEVEL=${LOG_LEVEL:-INFO}"
      - "KARL_SYNC_INTERVAL=${KARL_SYNC_INTERVAL:-10}"
      # Metrics bind: 0.0.0.0 only for the internal compose network (Prometheus
      # scrape); :9191 is NOT published to the host. Loopback is the code default.
      # Token comes from the shared secret file (same source Prometheus uses).
      - "METRICS_BIND_ALL=true"
      - "METRICS_TOKEN_FILE=/run/secrets/metrics_token"
    secrets:
      - metrics_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - app_data:/app/data
      - ./logs:/app/logs

  postgres:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b  # refresh: docker buildx imagetools inspect postgres:15-alpine
    container_name: astrofinsentinel_db
    environment:
      - "POSTGRES_DB=${POSTGRES_DB:-astrofin}"
      - "POSTGRES_USER=${POSTGRES_USER:-postgres}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Schema is created idempotently by the app entrypoint `python -m db`
      # (Base.metadata.create_all). No init.sql is mounted — do not add one
      # with secrets here.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf  # refresh: docker buildx imagetools inspect redis:7-alpine
    container_name: astrofinsentinel_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94  # refresh: docker buildx imagetools inspect prom/prometheus:v2.54.1
    container_name: astrofinsentinel_prom
    secrets:
      - metrics_token
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f  # refresh: docker buildx imagetools inspect grafana/grafana:11.2.0
    container_name: astrofinsentinel_grafana
    ports:
      # Loopback only — local dashboard access; not exposed to the world.
      - "127.0.0.1:3000:3000"
    environment:
      - "GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER is required}"
      - "GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password"
      - "GF_SECURITY_SECRET_KEY__FILE=/run/secrets/grafana_secret_key"
      - "GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:?GF_SERVER_ROOT_URL is required}"
      - "GF_USERS_ALLOW_SIGN_UP=false"
      - "GF_AUTH_ANONYMOUS_ENABLED=false"
      - "GF_USERS_ALLOW_ORG_CREATE=false"
      - "GF_SECURITY_ALLOW_EMBEDDING=false"
      - "GF_SECURITY_COOKIE_SAMESITE=strict"
      - "GF_SECURITY_COOKIE_SECURE=false"
    secrets:
      - grafana_admin_password
      - grafana_secret_key
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  prom_data:
  grafana_data:
  app_data:

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  grafana_secret_key:
    file: ./secrets/grafana_secret_key
  metrics_token:
    file: ./secrets/metrics_token
