version: '3.8'

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: astrofinsentinel_app
    environment:
      - "DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}"
      - "REDIS_URL=${REDIS_URL:-redis://redis:6379/0}"
      - "LOG_LEVEL=${LOG_LEVEL:-INFO}"
      - "KARL_SYNC_INTERVAL=${KARL_SYNC_INTERVAL:-10}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - app_data:/app/data
      - ./logs:/app/logs

  postgres:
    image: postgres:15-alpine
    container_name: astrofinsentinel_db
    environment:
      - "POSTGRES_DB=${POSTGRES_DB:-astrofin}"
      - "POSTGRES_USER=${POSTGRES_USER:-postgres}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: astrofinsentinel_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: astrofinsentinel_prom
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: astrofinsentinel_grafana
    ports:
      # Loopback only — local dashboard access; not exposed to the world.
      - "127.0.0.1:3000:3000"
    environment:
      - "GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER is required}"
      - "GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}"
      - "GF_USERS_ALLOW_SIGN_UP=false"
      - "GF_AUTH_ANONYMOUS_ENABLED=false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  prom_data:
  grafana_data:
  app_data:
