# Dex IdP overlay — apply ON TOP of docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.dex.yml up -d
#
# Loopback-only Dex OIDC provider (issuer http://127.0.0.1:5556/dex).
# Grafana password login stays (C11 DISABLE_LOGIN_FORM is not enabled).
services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1@sha256:bc7cfce7c17f52864e2bb2a4dc1d2f86a41e3019f6d42e81d92a301fad0c8a1d  # refresh: docker buildx imagetools inspect ghcr.io/dexidp/dex:v2.41.1
    container_name: astrofinsentinel_dex
    ports:
      - "127.0.0.1:5556:5556"
    command: ["serve", "/etc/dex/config.yaml"]
    environment:
      - "DEX_EXPAND_ENV=true"
      - "DEX_ISSUER=${DEX_ISSUER:?DEX_ISSUER is required}"
      - "DEX_GRAFANA_CLIENT_ID=${DEX_GRAFANA_CLIENT_ID:?DEX_GRAFANA_CLIENT_ID is required}"
      - "DEX_GRAFANA_CLIENT_SECRET=${DEX_GRAFANA_CLIENT_SECRET:?DEX_GRAFANA_CLIENT_SECRET is required}"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/lib/dex
    restart: unless-stopped

volumes:
  dex-data:
