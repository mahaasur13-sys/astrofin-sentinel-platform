# Grafana PUBLIC edge overlay — apply ON TOP of docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.grafana-edge-public.yml up -d
#
# Public Caddy on :80/:443 with ACME (Let's Encrypt). Grafana has NO host port.
# This is the C12 public profile; the C7 loopback edge is unchanged.
services:
  grafana:
    ports: !reset []

  caddy:
    image: caddy:2.8.4@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f  # refresh: docker buildx imagetools inspect caddy:2.8.4
    container_name: astrofinsentinel_caddy_public
    ports:
      - "80:80"
      - "443:443"
    environment:
      - "DOMAIN=${DOMAIN:?DOMAIN is required}"
      - "ACME_EMAIL=${ACME_EMAIL:?ACME_EMAIL is required}"
    volumes:
      - ./edge/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
