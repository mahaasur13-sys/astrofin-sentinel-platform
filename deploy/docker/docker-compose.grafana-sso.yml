# Grafana forced-SSO overlay — apply ON TOP of docker-compose.yml + dex.
#
# Supported profile:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.dex.yml \
#     -f docker-compose.grafana-sso.yml up -d
#
# Hides the password login form and auto-redirects to Generic OAuth.
# base+sso WITHOUT dex is NOT a supported profile.
services:
  grafana:
    environment:
      - "GF_AUTH_DISABLE_LOGIN_FORM=true"
      - "GF_AUTH_GENERIC_OAUTH_ENABLED=true"
      - "GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=true"
      - "GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=false"
      - "GF_AUTH_GENERIC_OAUTH_NAME=${GF_AUTH_GENERIC_OAUTH_NAME:?GF_AUTH_GENERIC_OAUTH_NAME is required}"
      - "GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GF_AUTH_GENERIC_OAUTH_CLIENT_ID:?GF_AUTH_GENERIC_OAUTH_CLIENT_ID is required}"
      - "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:?GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET is required}"
      - "GF_AUTH_GENERIC_OAUTH_AUTH_URL=${GF_AUTH_GENERIC_OAUTH_AUTH_URL:?GF_AUTH_GENERIC_OAUTH_AUTH_URL is required}"
      - "GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${GF_AUTH_GENERIC_OAUTH_TOKEN_URL:?GF_AUTH_GENERIC_OAUTH_TOKEN_URL is required}"
      - "GF_AUTH_GENERIC_OAUTH_API_URL=${GF_AUTH_GENERIC_OAUTH_API_URL:?GF_AUTH_GENERIC_OAUTH_API_URL is required}"
      - "GF_AUTH_GENERIC_OAUTH_SCOPES=${GF_AUTH_GENERIC_OAUTH_SCOPES:?GF_AUTH_GENERIC_OAUTH_SCOPES is required}"
