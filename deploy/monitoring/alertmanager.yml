global:
  resolve_timeout: 5m

route:
  receiver: relay
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="Watchdog"']
      receiver: discard
    - matchers: ['severity="critical"']
      receiver: relay
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h

receivers:
  - name: relay
    webhook_configs:
      - url: http://127.0.0.1:8099/notify
        send_resolved: true
  - name: discard
