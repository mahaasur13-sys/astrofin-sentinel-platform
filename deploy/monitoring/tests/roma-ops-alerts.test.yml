rule_files:
  - ../alert_rules.yml
evaluation_interval: 1m
tests:
  # Healthy: ledger reconciles, pool is quiet, backup is recent — no ROMA ops alert
  # may fire. promtool simulates time() from the test epoch, so a recent backup is
  # simply the epoch itself (age stays at minutes, far below the 28h window).
  - name: a_healthy_no_fire
    interval: 1m
    input_series:
      - series: 'roma_ledger_tenants_drifted'
        values: '0+0x17'
      - series: 'roma_ledger_reconciliation_diff_max'
        values: '0.015+0x17'
      - series: 'roma_ledger_reconcile_last_success_timestamp_seconds'
        values: '0+0x17'
      - series: 'roma_pg_connections_active{pool="billing"}'
        values: '3+0x17'
      - series: 'roma_backup_last_success_timestamp'
        values: '0+0x17'
    alert_rule_test:
      - eval_time: 16m
        alertname: ROMALedgerDrift
        exp_alerts: []
      - eval_time: 16m
        alertname: ROMALedgerMetricsAbsent
        exp_alerts: []
      - eval_time: 16m
        alertname: ROMALedgerStale
        exp_alerts: []
      - eval_time: 16m
        alertname: ROMAPGPoolSaturation
        exp_alerts: []
      - eval_time: 16m
        alertname: ROMABackupStale
        exp_alerts: []

  # Ledger drift: tenants_drifted > 0 sustained for 15m. Per-tenant identifiers
  # live in the ROMA log, not in the metric, so the alert carries no tenant_id.
  - name: b_ledger_drift_fires
    interval: 1m
    input_series:
      - series: 'roma_ledger_tenants_drifted'
        values: '2+0x18'
      - series: 'roma_ledger_reconciliation_diff_max'
        values: '1.5+0x18'
      - series: 'roma_ledger_reconcile_last_success_timestamp_seconds'
        values: '0+0x18'
      - series: 'roma_pg_connections_active{pool="billing"}'
        values: '3+0x18'
      - series: 'roma_backup_last_success_timestamp'
        values: '0+0x18'
    alert_rule_test:
      - eval_time: 17m
        alertname: ROMALedgerDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              category: billing
            exp_annotations:
              summary: "ROMA ledger drift on 2 tenant(s)"
              description: >-
                roma_ledger_tenants_drifted counts tenants whose ledger DEBIT sum differs from usage cost
                by more than ROMA_LEDGER_DRIFT_THRESHOLD_USD (default 0.05). Tenant ids are logged by the
                900s reconcile loop (top-20 by |diff|). Re-run scripts/reconciliation.py and check billing
                DB writes before the next spend-cap cycle.
      - eval_time: 17m
        alertname: ROMALedgerMetricsAbsent
        exp_alerts: []
      - eval_time: 17m
        alertname: ROMALedgerStale
        exp_alerts: []
      - eval_time: 17m
        alertname: ROMAPGPoolSaturation
        exp_alerts: []

  # Metrics gone from /metrics: the drift rule can no longer prove anything, so the
  # absent-guard fires on its own and drift stays silent.
  - name: c_ledger_metrics_absent_fires
    interval: 1m
    input_series:
      - series: 'roma_pg_connections_active{pool="billing"}'
        values: '3+0x17'
      - series: 'roma_backup_last_success_timestamp'
        values: '0+0x17'
    alert_rule_test:
      - eval_time: 17m
        alertname: ROMALedgerMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              category: billing
            exp_annotations:
              summary: "ROMA ledger reconciliation metrics missing"
              description: >-
                roma_ledger_reconciliation_diff_max or roma_ledger_reconcile_last_success_timestamp_seconds is
                absent from ROMA /metrics, so ROMALedgerDrift proves nothing. Check that the reconcile loop
                started and the exporter still publishes the billing block.
      - eval_time: 17m
        alertname: ROMALedgerDrift
        exp_alerts: []
      - eval_time: 17m
        alertname: ROMALedgerStale
        exp_alerts: []

  # Loop stalled: last_success stops advancing, so after 1800s (two 900s cycles)
  # the staleness rule fires while drift/absent stay silent.
  - name: d_ledger_stale_fires
    interval: 1m
    input_series:
      - series: 'roma_ledger_tenants_drifted'
        values: '0+0x41'
      - series: 'roma_ledger_reconciliation_diff_max'
        values: '0.015+0x41'
      - series: 'roma_ledger_reconcile_last_success_timestamp_seconds'
        values: '0+0x41'
      - series: 'roma_pg_connections_active{pool="billing"}'
        values: '3+0x41'
      - series: 'roma_backup_last_success_timestamp'
        values: '0+0x41'
    alert_rule_test:
      - eval_time: 36m
        alertname: ROMALedgerStale
        exp_alerts:
          - exp_labels:
              severity: warning
              category: billing
            exp_annotations:
              summary: "ROMA ledger reconciliation stale (2160s since last success)"
              description: >-
                The 900s reconcile loop has not completed successfully for more than 1800s (two missed cycles).
                last_success is only advanced on a successful pass, so this also covers a loop that keeps
                raising (PG unavailable, bad SQL).
      - eval_time: 36m
        alertname: ROMALedgerDrift
        exp_alerts: []
      - eval_time: 36m
        alertname: ROMALedgerMetricsAbsent
        exp_alerts: []

  # Pool saturation: 12 active > threshold 8.
  - name: e_pg_pool_saturation_fires
    interval: 1m
    input_series:
      - series: 'roma_ledger_tenants_drifted'
        values: '0+0x14'
      - series: 'roma_pg_connections_active{pool="billing"}'
        values: '12+0x14'
      - series: 'roma_backup_last_success_timestamp'
        values: '0+0x14'
    alert_rule_test:
      - eval_time: 7m
        alertname: ROMAPGPoolSaturation
        exp_alerts:
          - exp_labels:
              severity: warning
              category: infra
              pool: billing
            exp_annotations:
              summary: "ROMA PG pool saturation (12 active on billing)"
              description: "Postgres pool billing holds more than 8 active connections for 5m. Check slow queries, pool sizing and leaked connections in roma-execution-bridge."
      - eval_time: 7m
        alertname: ROMALedgerDrift
        exp_alerts: []

  # Backup older than 28h: the timestamp is 200000s before the test epoch, so the
  # age is ~200000s > 100800s once evaluation time advances.
  - name: f_backup_stale_fires
    interval: 1m
    input_series:
      - series: 'roma_ledger_tenants_drifted'
        values: '0+0x31'
      - series: 'roma_pg_connections_active{pool="billing"}'
        values: '3+0x31'
      - series: 'roma_backup_last_success_timestamp'
        values: '-200000+0x31'
    alert_rule_test:
      - eval_time: 17m
        alertname: ROMABackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              category: backup
            exp_annotations:
              summary: "ROMA backup older than 28h"
              description: "roma_backup_last_success_timestamp has not advanced for more than 28h; a value of 0 means no backup was ever recorded. Check the ROMA backup job and its target directory."
      - eval_time: 17m
        alertname: ROMAPGPoolSaturation
        exp_alerts: []
