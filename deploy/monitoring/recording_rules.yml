groups:
  # =======================================================================
  # AstroFin Sentinel — SLO Recording Rules (Calibrated v1.0.0-beta)
  # Calibration: docs/slo-calibration-2026-08-04.md (G-09)
  # Source of truth: docs/slo.md (v1.0, updated 99.0% beta target)
  # These rules are evaluated by Prometheus and consumed by:
  #   - alert_rules.yml   (for SLOBudgetBurn / HighErrorRate / HighLatency)
  #   - Grafana dashboards
  #   - `astrofin_slo_error_budget_remaining` queries from RUNBOOK.md
  # =======================================================================

  - name: astrofin_slo_recording
    interval: 30s
    rules:

      # ------------------------------------------------------------------
      # SLO-1: API availability
      # SLO: ≥ 99.0% (beta, calibrated from 99.5%/99.9% mismatch)
      # Error budget: 7.2h/month → 14.4 min/day → 1.44 min/burn‑rate‑2
      # ------------------------------------------------------------------
      - record: astrofin:slo:availability:ratio_5m
        expr: |
          sum(rate(http_requests_total{job=~"astrofin-.*",code!~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job=~"astrofin-.*"}[5m]))

      - record: astrofin:slo:availability:ratio_30d
        expr: |
          sum(rate(http_requests_total{job=~"astrofin-.*",code!~"5.."}[30d]))
          /
          sum(rate(http_requests_total{job=~"astrofin-.*"}[30d]))

      - record: astrofin:slo:availability:error_budget_remaining_30d
        expr: |
          1 - (
            (1 - astrofin:slo:availability:ratio_30d)
            /
            (1 - 0.99)
          )

      # ------------------------------------------------------------------
      # SLO-2a: Dashboard latency p95 (< 200ms target)
      # ------------------------------------------------------------------
      - record: astrofin:dashboard:latency_p95:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{path="/api/v1/dashboard"}[5m]))
          )

      - record: astrofin:dashboard:latency_p95:1h
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{path="/api/v1/dashboard"}[1h]))
          )

      # ------------------------------------------------------------------
      # SLO-2b: Agent inference latency p95 (< 800ms target)
      # ------------------------------------------------------------------
      - record: astrofin:agent:latency_p95:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{path="/api/v1/agent/run"}[5m]))
          )

      - record: astrofin:agent:latency_p95:1h
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{path="/api/v1/agent/run"}[1h]))
          )

      # ------------------------------------------------------------------
      # SLO-2c: Health probe latency p95 (< 50ms target)
      # ------------------------------------------------------------------
      - record: astrofin:health:latency_p95:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{path="/health"}[5m]))
          )

      # ------------------------------------------------------------------
      # SLO-3: Error rate (< 0.1% target)
      # ------------------------------------------------------------------
      - record: astrofin:slo:error_rate:5m
        expr: |
          sum(rate(http_requests_total{job=~"astrofin-.*",code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total{job=~"astrofin-.*"}[5m])), 1e-9)

      # ------------------------------------------------------------------
      # SLO-4: Blackbox healthcheck uptime (≥ 99.9% target)
      # ------------------------------------------------------------------
      - record: astrofin:slo:healthcheck_uptime:ratio_30d
        expr: |
          avg_over_time(probe_success{job="blackbox-web"}[30d])

  - name: astrofin_service_recording
    interval: 30s
    rules:

      # ------------------------------------------------------------------
      # Per-service request rate and error rate (for dashboards + alerts)
      # ------------------------------------------------------------------
      - record: astrofin:service:request_rate:5m
        expr: sum by (service, job) (rate(http_requests_total[5m]))

      - record: astrofin:service:error_rate:5m
        expr: |
          sum by (service, job) (rate(http_requests_total{code=~"5.."}[5m]))
          /
          clamp_min(sum by (service, job) (rate(http_requests_total[5m])), 1e-9)

      # ------------------------------------------------------------------
      # Per-service latency p50 / p95 / p99 (for dashboards)
      # ------------------------------------------------------------------
      - record: astrofin:service:latency_p50:5m
        expr: |
          histogram_quantile(0.50,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))

      - record: astrofin:service:latency_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))

      - record: astrofin:service:latency_p99:5m
        expr: |
          histogram_quantile(0.99,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))

      # ------------------------------------------------------------------
      # Service up (1 if scrape succeeded in last 1m, 0 otherwise)
      # ------------------------------------------------------------------
      - record: astrofin:service:up:1m
        expr: avg_over_time(up{job=~"astrofin-.*"}[1m])
