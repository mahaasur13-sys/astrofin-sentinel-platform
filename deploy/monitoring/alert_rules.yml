groups:
  # =======================================================================
  # AstroFin Sentinel — Alert Rules
  # Source of truth: docs/slo.md and SLO.md
  # All thresholds come from the SLO document. Do not edit numbers
  # here without updating docs/slo.md.
  # =======================================================================

  - name: astrofin_slo
    interval: 30s
    rules:

      # ------------------------------------------------------------------
      # SLOBudgetBurn — fires when the 30-day error budget is being
      # consumed faster than allowed. Two windows per docs/slo.md:
      #   - 1h fast burn (14.4×) → SEV-2 page
      #   - 6h slow burn (6×)    → Slack warning
      # ------------------------------------------------------------------
      - alert: SLOAvailabilityBurnFast
        expr: |
          (1 - astrofin:slo:availability:ratio_5m)
          >
          (1 - astrofin:slo:availability:ratio_30d) * 14.4
        for: 2m
        labels:
          severity: critical
          slo: availability
          burn_window: 1h
        annotations:
          summary: "SLO-1 availability: fast burn detected"
          description: |
            API availability is 14.4× worse than the 30-day baseline.
            At this rate the 30-day error budget will be exhausted in ~2 days.
            See RUNBOOK.md → "SLOAvailabilityBurnFast".
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#sloavailabilityburnfast

      - alert: SLOAvailabilityBurnSlow
        expr: |
          (1 - astrofin:slo:availability:ratio_30d)
          >
          (1 - 0.995) * 0.5
        for: 5m
        labels:
          severity: warning
          slo: availability
          burn_window: 30d
        annotations:
          summary: "SLO-1 availability: >50% of monthly error budget consumed"
          description: |
            More than 50% of the 30-day error budget has been used.
            New non-critical releases are frozen (see SLO.md → Error budget policy).
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#sloavailabilityburnslow

      # ------------------------------------------------------------------
      # Latency budget burn — SLO-2: p95 < 500 ms
      # ------------------------------------------------------------------
      - alert: SLOLatencyBudgetBurn
        expr: astrofin:slo:latency_p95:5m > 0.5
        for: 10m
        labels:
          severity: critical
          slo: latency
        annotations:
          summary: "SLO-2 latency: p95 of POST /api/v1/submit > 500ms for 10m"
          description: |
            p95 latency on the submission endpoint is {{ $value | humanizeDuration }}
            (target: < 500 ms). Investigate downstream ML-engine / feature-pipeline
            saturation.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#slolatencybudgetburn

  - name: astrofin_service_health
    interval: 30s
    rules:

      # ------------------------------------------------------------------
      # ServiceDown — any astrofin-* service has stopped scraping
      # ------------------------------------------------------------------
      - alert: ServiceDown
        expr: astrofin:service:up:1m == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: |
            Prometheus has not been able to scrape {{ $labels.job }} for 2 minutes.
            Check the container/process and the network route.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#servicedown

      # ------------------------------------------------------------------
      # HighErrorRate — 5xx ratio above 5% over 5 minutes
      # ------------------------------------------------------------------
      - alert: HighErrorRate
        expr: astrofin:service:error_rate:5m > 0.05
        for: 5m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: "High 5xx rate on {{ $labels.service }}"
          description: |
            5xx error rate on {{ $labels.service }} is {{ $value | humanizePercentage }}
            over the last 5 minutes (threshold: 5%). Likely tied to a recent deploy
            or an upstream dependency.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#higherrorrate

      - alert: HighErrorRateCritical
        expr: astrofin:service:error_rate:5m > 0.20
        for: 2m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "Critical 5xx rate on {{ $labels.service }}"
          description: |
            5xx rate on {{ $labels.service }} is {{ $value | humanizePercentage }} —
            a fifth of all requests are failing. Page on-call.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#higherrorratecritical

      # ------------------------------------------------------------------
      # HighLatency — generic p95 > 1s for any service
      # (Catches services that are not /api/v1/submit, which has its own
      #  SLOLatencyBudgetBurn rule above.)
      # ------------------------------------------------------------------
      - alert: HighLatency
        expr: astrofin:service:latency_p95:5m > 1.0
        for: 10m
        labels:
          severity: warning
          category: latency
        annotations:
          summary: "p95 latency on {{ $labels.service }} > 1s for 10m"
          description: |
            p95 latency is {{ $value }}s. Check slow-query logs, downstream
            latency, and resource saturation (CPU/mem).
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#highlatency

      # ------------------------------------------------------------------
      # HealthcheckFailing — SLO-3: blackbox probe failures
      # ------------------------------------------------------------------
      - alert: HealthcheckFailing
        expr: probe_success{job="blackbox-web"} == 0
        for: 3m
        labels:
          severity: critical
          slo: healthcheck
        annotations:
          summary: "Blackbox healthcheck failing for {{ $labels.instance }}"
          description: |
            Healthcheck probe to {{ $labels.instance }} has been failing for
            3 minutes. Affects SLO-3 (99.95% target).
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#healthcheckfailing

  - name: astrofin_meta
    interval: 30s
    rules:

      # ------------------------------------------------------------------
      # Watchdog — the existing self-test alert. Kept for Alertmanager→Slack
      # verification, do not remove.
      # ------------------------------------------------------------------
      - alert: Watchdog
        expr: vector(1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Test alert from AstroFin Sentinel Platform"
          description: "Verifies Alertmanager → Slack/PagerDuty routing."
      # ------------------------------------------------------------------
      # Pod restart storm (> 3 restarts / 5m)
      # ------------------------------------------------------------------
      - alert: PodRestartStorm
        expr: |
          rate(kube_pod_container_status_restarts_total{
            namespace="astrofin-sentinel",
            container!~"istio-proxy|linkerd-proxy"
          }[5m]) * 300 > 3
        for: 5m
        labels:
          severity: critical
          team: sre
          category: infra
        annotations:
          summary: "Pod {{ $labels.pod }} restarting rapidly"
          description: |
            Container {{ $labels.container }} has restarted more than
            3 times in 5 minutes. Check OOMKill, liveness probe, or panic.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#podrestartstorm

      # ------------------------------------------------------------------
      # CPU throttled > 25% of periods
      # ------------------------------------------------------------------
      - alert: PodCPUThrottled
        expr: |
          (
            rate(container_cpu_cfs_throttled_seconds_total{
              namespace="astrofin-sentinel"
            }[5m])
            /
            rate(container_cpu_cfs_periods_total{
              namespace="astrofin-sentinel"
            }[5m])
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          team: sre
          category: infra
        annotations:
          summary: "Pod {{ $labels.pod }} испытывает CPU throttling"
          description: |
            Более 25% CPU-периодов подвержены throttling.
            Рекомендуется увеличить CPU limit или оптимизировать код.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#podcputhrottled

      # ------------------------------------------------------------------
      # Memory usage > 85% of limit
      # ------------------------------------------------------------------
      - alert: PodMemoryPressure
        expr: |
          container_memory_working_set_bytes{namespace="astrofin-sentinel"}
            /
          container_spec_memory_limit_bytes{namespace="astrofin-sentinel"}
            > 0.85
        for: 10m
        labels:
          severity: warning
          team: sre
          category: infra
        annotations:
          summary: "Pod {{ $labels.pod }} использует > 85% memory limit"
          description: |
            memory_working_set = {{ $value | humanizePercentage }} of limit.
            Возможен OOMKill при росте нагрузки.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#podmemorypressure

      # ------------------------------------------------------------------
      # Deployment replicas mismatch
      # ------------------------------------------------------------------
      - alert: DeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas{namespace="astrofin-sentinel"}
            !=
          kube_deployment_status_replicas_available{namespace="astrofin-sentinel"}
        for: 5m
        labels:
          severity: warning
          team: sre
          category: infra
        annotations:
          summary: "Deployment {{ $labels.deployment }} replicas mismatch"
          description: |
            spec={{ $labels.deployment }} replicas ≠ available replicas.
            Возможна проблема с rolling update.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#deploymentreplicasmismatch

      # ------------------------------------------------------------------
      # Disk pressure on PostgreSQL volume
      # ------------------------------------------------------------------
      - alert: PostgresDiskPressure
        expr: |
          kubelet_volume_stats_available_bytes{
            namespace="astrofin-sentinel",
            persistentvolumeclaim=~"postgres-.*"
          }
            /
          kubelet_volume_stats_capacity_bytes{
            namespace="astrofin-sentinel",
            persistentvolumeclaim=~"postgres-.*"
          }
            < 0.15
        for: 10m
        labels:
          severity: critical
          team: sre
          category: infra
        annotations:
          summary: "PostgreSQL PVC < 15% свободного места"
          description: |
            available_bytes / capacity = {{ $value | humanizePercentage }}.
            WAL archiving might fail. Run `wal-g backup-push` and expand volume.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#postgresdiskpressure

      # ------------------------------------------------------------------
      # WAL-G backup stale (no successful backup in 28h)
      # ------------------------------------------------------------------
      - alert: WALGBackupStale
        expr: |
          time() - (
            max by (instance) (walg_backup_last_success_timestamp)
            or
            vector(1700000000)
          ) > 100800
        for: 2m
        labels:
          severity: critical
          team: sre
          category: backup
        annotations:
          summary: "WAL-G backup старше 28 часов"
          description: |
            Последний успешный WAL-G backup сделан более 28h назад.
            RPO нарушен. Проверьте `wal-g backup-list` и cron.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#walgbackupstale

