groups:
  # =======================================================================
  # AstroFin Sentinel — Alert Rules
  # Source of truth: docs/slo.md and SLO.md
  # All thresholds come from the SLO document. Do not edit numbers
  # here without updating docs/slo.md.
  # =======================================================================

  - name: astrofin_meta
    interval: 30s
    rules:

      # ------------------------------------------------------------------
      # Watchdog — the existing self-test alert. Kept for Alertmanager→Slack
      # verification, do not remove.
      # ------------------------------------------------------------------
      - alert: Watchdog
        expr: vector(1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Test alert from AstroFin Sentinel Platform"
          description: "Verifies Alertmanager → Slack/PagerDuty routing."
      # ------------------------------------------------------------------
      # WAL-G backup stale (no successful backup in 28h)
      # ------------------------------------------------------------------
      - alert: WALGBackupStale
        expr: time() - max by (instance) (walg_backup_last_success_timestamp) > 100800
        for: 2m
        labels:
          severity: critical
          team: sre
          category: backup
        annotations:
          summary: "WAL-G backup старше 28 часов"
          description: |
            Последний успешный WAL-G backup сделан более 28h назад.
            RPO нарушен. Проверьте `wal-g backup-list` и cron.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md#walgbackupstale

      - alert: WALGBackupMetricAbsent
        expr: absent(walg_backup_last_success_timestamp)
        for: 10m
        labels:
          severity: critical
          team: sre
          category: backup
        annotations:
          summary: "WAL-G backup: метрика отсутствует"
          description: |
            Экспортёр не отдаёт walg_backup_last_success_timestamp уже 10m —
            бэкепов нет либо сломан astrofin-metrics-exporter (state.json отсутствует).

      - alert: WALGBackupFailed
        expr: walg_backup_last_result == 0
        for: 5m
        labels:
          severity: warning
          category: backup
        annotations:
          summary: "WAL-G backup: последний запуск неуспешен"
          description: |
            state.json сообщает last_result=fail (pg_dump упал на одной из баз).
            Проверьте /dev/shm/astrofin-pgdump.log.


      # ------------------------------------------------------------------
      # Offsite copy of the pg_dump set to Backblaze B2 (scripts/pgdump_offsite.sh)
      # ------------------------------------------------------------------
      - alert: PgdumpOffsiteStale
        expr: (time() - pgdump_offsite_last_success_timestamp) > 100800
        for: 15m
        labels:
          severity: critical
          team: sre
          category: backup
        annotations:
          summary: "Offsite pg_dump старше 28 часов"
          description: |
            pgdump_offsite_last_success_timestamp старше 28h — копия в B2 не обновляется.
            Проверьте /dev/shm/astrofin-pgdump.log и offsite_state.json.

      - alert: PgdumpOffsiteFailed
        expr: pgdump_offsite_last_result == 0
        for: 30m
        labels:
          severity: warning
          team: sre
          category: backup
        annotations:
          summary: "Offsite pg_dump: последняя загрузка в B2 неуспешна"
          description: |
            offsite_state.json сообщает last_result=fail: rclone upload или проверка
            sha256 не прошли. Локальный дамп при этом на месте.

      - alert: PgdumpOffsiteMetricAbsent
        expr: absent(pgdump_offsite_last_success_timestamp)
        for: 30m
        labels:
          severity: warning
          team: sre
          category: backup
        annotations:
          summary: "Offsite pg_dump: метрика отсутствует"
          description: |
            Экспортёр не отдаёт pgdump_offsite_last_success_timestamp уже 30m —
            offsite_state.json отсутствует либо astrofin-metrics-exporter сломан.

  - name: astrofin_trading_engine
    interval: 30s
    rules:

      - alert: TradingEngineSilent
        expr: |
          time() - trading_engine_last_signal_timestamp_seconds > 600
        for: 2m
        labels:
          severity: critical
          service: astrofin-prod-strategy
          category: trading-engine
        annotations:
          summary: "Trading engine: нет новых строк в trading_signals > 10 мин"
          description: |
            Последняя запись в trading_signals была {{ $value | humanizeDuration }} назад
            (цикл раз в 60с). Проверь /dev/shm/astrofin-prod-strategy.log: частые причины —
            пропуск цикла из-за отсутствия backtest/data_cache/XAUUSD_4h.json или отказ БД.
          runbook: https://github.com/mahaasur13-sys/astrofin-sentinel-platform/blob/master/RUNBOOK.md

      - alert: TradingEngineDown
        expr: up{job="astrofin-prod-strategy"} == 0
        for: 2m
        labels:
          severity: critical
          service: astrofin-prod-strategy
          category: trading-engine
        annotations:
          summary: "Trading engine: процесс не отвечает на scrape"
          description: |
            Prometheus не может снять метрики с localhost:9193 — процесс
            astrofin-prod-strategy не запущен или упал (проверь supervisorctl status).
  # ------------------------------------------------------------------------
  # Jev R1 shadow — включено 2026-10-19 (флаги JEV_ENABLED=1, JEV_GATE_SHADOW=1
  # добавлены в реестр сервиса ключами). Метрики: roma_jev_shadow_*
  # (job roma-execution-bridge, target localhost:8900).
  # Runbook: docs/jev-shadow-ops-runbook.md
  # Откат: удалить JEV_GATE_SHADOW и JEV_ENABLED из реестра сервиса ключами.
  # ------------------------------------------------------------------------
  - name: roma-jev-shadow
    interval: 30s
    rules:
      - alert: JevShadowFallbackHigh
        # Denominator excludes disabled too: _record_fallback increments
        # observations_total for disabled as well. A - empty == empty in PromQL,
        # hence the "or" fallback to the raw observations rate.
        expr: |
          (
            sum by (point) (rate(roma_jev_shadow_fallback_total{point="R1", reason!="disabled"}[30m]))
            /
            clamp_min(
              sum by (point) (rate(roma_jev_shadow_observations_total{point="R1"}[30m]))
              - sum by (point) (rate(roma_jev_shadow_fallback_total{point="R1", reason="disabled"}[30m]))
              or sum by (point) (rate(roma_jev_shadow_observations_total{point="R1"}[30m])),
              1e-9
            )
          ) > 0.2
          and
          (
            sum by (point) (rate(roma_jev_shadow_observations_total{point="R1"}[30m]))
            - sum by (point) (rate(roma_jev_shadow_fallback_total{point="R1", reason="disabled"}[30m]))
            or sum by (point) (rate(roma_jev_shadow_observations_total{point="R1"}[30m]))
          ) > 0
        for: 15m
        labels: {severity: warning, category: jev-shadow}
        annotations:
          summary: "Jev R1 shadow: fallback выше 20% наблюдений ({{ $value | humanizePercentage }})"
          description: |
            Доля fallback-исходов среди shadow-наблюдений R1 выше 20% за 30m
            (reason="disabled" исключён из числителя и знаменателя). Shadow не
            меняет вердикт, но деградация Jev скрывает реальные расхождения
            классификатора.
            Runbook: https://github.com/mahaasur13-sys/roma-execution-bridge/blob/master/docs/jev-shadow-ops-runbook.md
            Откат: удалить JEV_GATE_SHADOW и JEV_ENABLED из реестра сервиса ключами.

      - alert: JevShadowDropped
        # increase() is reset-safe (5->0->1 still yields increase>0). The right branch
        # applies `unless offset` PER-SERIES before sum, so a brand-new instance's
        # first drop fires even when other instances already have 15m of history.
        expr: |
          (
            sum by (point) (increase(roma_jev_shadow_dropped_total{point="R1"}[15m])) > 0
            or
            (sum by (point) (
              roma_jev_shadow_dropped_total{point="R1"} > 0
              unless roma_jev_shadow_dropped_total{point="R1"} offset 15m
            ) > 0)
          )
        for: 0m
        labels: {severity: warning, category: jev-shadow}
        annotations:
          summary: "Jev R1 shadow: наблюдения отброшены (dropped)"
          description: |
            Очередь bounded-обсервера переполнена: хотя бы одно наблюдение отброшено
            за 15m либо серия впервые появилась с ненулевым значением.
            Данные shadow неполные, agreement-метрика занижена.
            Runbook: https://github.com/mahaasur13-sys/roma-execution-bridge/blob/master/docs/jev-shadow-ops-runbook.md
            Откат: удалить JEV_GATE_SHADOW и JEV_ENABLED из реестра сервиса ключами.

  # ------------------------------------------------------------------------
  # ROMA canon — группы roma-critical / roma-warning / roma-billing скопированы
  # побайтово из roma-execution-bridge@8fe47283 deploy/monitoring/alert-rules-roma.yml.
  # Дрейф ловит .github/scripts/check-jev-canon-drift.sh (те же группы).
  # Откат: удалить блок от этого комментария до конца файла.
  # ------------------------------------------------------------------------

  - name: roma-critical
    rules:
      - alert: ROMAHighErrorRate
        expr: |
          sum(rate(roma_requests_total{status=~"5.."}[5m]))
          / sum(rate(roma_requests_total[5m])) > 0.05
        for: 5m
        labels: {severity: critical, category: api}
        annotations:
          summary: "ROMA error rate above 5% ({{ $value | humanizePercentage }})"
          description: "5xx errors spiking. Check /metrics and Loki logs for /dev/shm/roma-execution-bridge.log"

      - alert: ROMABillingWebhookDown
        expr: sum(increase(roma_cloudpayments_failure_total[10m])) > 0
        for: 3m
        labels: {severity: critical, category: billing}
        annotations:
          summary: "CloudPayments webhook failures detected"
          description: "investigate immediately — tenants cannot complete payments"

      - alert: ROMABillingMetricsAbsent
        expr: absent(roma_cloudpayments_failure_total)
        for: 10m
        labels: {severity: critical, category: billing}
        annotations:
          summary: "CloudPayments metrics missing — billing is blind"
          description: "roma_cloudpayments_failure_total stopped being exported, so webhook failures are unobservable and ROMABillingWebhookDown cannot fire. Check billing metrics wiring and /metrics."

      - alert: ROMANoMetrics
        expr: absent(roma_requests_total)
        for: 2m
        labels: {severity: critical, category: monitoring}
        annotations:
          summary: "ROMA /metrics endpoint not responding"


  - name: roma-warning
    rules:
      - alert: ROMAHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(roma_request_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels: {severity: warning, category: api}
        annotations:
          summary: "p95 latency > 1s ({{ $value }}s)"

      - alert: ROMADeepQueue
        expr: roma_queue_depth > 10
        for: 3m
        labels: {severity: warning, category: resources}
        annotations:
          summary: "Queue depth {{ $value }} ≥ 10 — backends may be slow"

      - alert: ROMAAuthSpike
        expr: rate(roma_auth_failures_total[5m]) > 0.2
        for: 5m
        labels: {severity: warning, category: security}
        annotations:
          summary: "Auth failures spiking: {{ $value }} failures/sec — possible brute force"


  - name: roma-billing
    rules:
      - alert: ROMASpendCap90Pct
        expr: roma_spend_cap_pct > 90
        for: 1m
        labels: {severity: warning, category: billing}
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} spend-cap at {{ $value }}% (plan {{ $labels.plan }})"
          description: "Balance ${{ query \"roma_spend_cap_balance_usd{tenant_id='$labels.tenant_id'}\" | first | value }} / ${{ query \"label_replace(roma_spend_cap_pct{tenant_id='$labels.tenant_id',plan='$labels.plan'},'cap','$value','','')\" | first | value }}. Consider upgrading plan."

      - alert: ROMASpendCapExceeded
        expr: rate(roma_spend_cap_blocked_total[5m]) > 0
        for: 1m
        labels: {severity: critical, category: billing}
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} jobs BLOCKED by spend-cap"
          description: "Plan {{ $labels.plan }} has reached its limit. Tenant needs to upgrade or wait for reset."

      - alert: ROMAHighGPUCost
        expr: rate(roma_gpu_seconds_total[15m]) * 0.00001 * 3600 > 1.0
        for: 5m
        labels: {severity: warning, category: billing}
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} GPU burn rate > $1/hr"
          description: "GPU seconds accumulating fast. Current rate: ${{ $value }}/hr."

      - alert: ROMANoBillingEvents
        expr: rate(roma_billing_cost_total[30m]) == 0 and rate(roma_requests_total[30m]) > 0
        for: 10m
        labels: {severity: warning, category: billing}
        annotations:
          summary: "Requests flowing but no billing events — _increment_usage may be broken"

  - name: roma-drill
    rules:
      - alert: ROMADRDrillStale
        expr: time() - roma_dr_drill_last_success_timestamp > 8 * 86400
        for: 1h
        labels: {severity: critical, category: backup}
        annotations:
          summary: "pg_restore drill не проходил 8 дней"
          description: |
            scripts/pg_restore_drill.sh не завершался успехом более 8 суток, либо
            метрика равна 0 (drill_state.json отсутствует/нечитаем). Дрилл — единственное
            доказательство того, что бэкапы действительно восстанавливаются.
            Проверить: cat /root/.sealed/pgdump/drill_state.json, /dev/shm/astrofin-pg-restore-drill.log.

  # AstroFin-only: watches ROMA metrics that exist in /metrics but have no rule
  # anywhere. Deliberately NOT part of the ROMA canon (the roma-* groups stay
  # byte-identical to roma-execution-bridge), so the canon drift guard ignores it.
  - name: roma-ops
    rules:
      # Replaces the per-tenant ROMALedgerDiff (abs(roma_ledger_reconciliation_diff) > 0):
      # PR #166 dropped that per-tenant gauge for aggregates, so the old expr had no series.
      - alert: ROMALedgerDrift
        expr: roma_ledger_tenants_drifted > 0
        for: 15m
        labels: {severity: warning, category: billing}
        annotations:
          summary: "ROMA ledger drift on {{ $value }} tenant(s)"
          description: "roma_ledger_tenants_drifted counts tenants whose ledger DEBIT sum differs from usage cost by more than ROMA_LEDGER_DRIFT_THRESHOLD_USD (default 0.05). Tenant ids are logged by the 900s reconcile loop (top-20 by |diff|). Re-run scripts/reconciliation.py and check billing DB writes before the next spend-cap cycle."

      - alert: ROMALedgerMetricsAbsent
        expr: absent(roma_ledger_reconciliation_diff_max) or absent(roma_ledger_reconcile_last_success_timestamp_seconds)
        for: 15m
        labels: {severity: warning, category: billing}
        annotations:
          summary: "ROMA ledger reconciliation metrics missing"
          description: "roma_ledger_reconciliation_diff_max or roma_ledger_reconcile_last_success_timestamp_seconds is absent from ROMA /metrics, so ROMALedgerDrift proves nothing. Check that the reconcile loop started and the exporter still publishes the billing block."

      - alert: ROMALedgerStale
        expr: time() - roma_ledger_reconcile_last_success_timestamp_seconds > 1800
        for: 5m
        labels: {severity: warning, category: billing}
        annotations:
          summary: "ROMA ledger reconciliation stale ({{ $value | printf \"%.0f\" }}s since last success)"
          description: "The 900s reconcile loop has not completed successfully for more than 1800s (two missed cycles). last_success is only advanced on a successful pass, so this also covers a loop that keeps raising (PG unavailable, bad SQL)."

      - alert: ROMAPGPoolSaturation
        expr: roma_pg_connections_active > 8
        for: 5m
        labels: {severity: warning, category: infra}
        annotations:
          summary: "ROMA PG pool saturation ({{ $value }} active on {{ $labels.pool }})"
          description: "Postgres pool {{ $labels.pool }} holds more than 8 active connections for 5m. Check slow queries, pool sizing and leaked connections in roma-execution-bridge."

      - alert: ROMABackupStale
        expr: (time() - roma_backup_last_success_timestamp) > 100800
        for: 15m
        labels: {severity: critical, category: backup}
        annotations:
          summary: "ROMA backup older than 28h"
          description: "roma_backup_last_success_timestamp has not advanced for more than 28h; a value of 0 means no backup was ever recorded. Check the ROMA backup job and its target directory."
      # AstroFin-only guard, same reasoning as WALGBackupMetricAbsent: ROMADRDrillStale
      # can only fire while the series exists, so a metric that vanished from
      # /metrics would make the drill silently untested. Value 0 is the exporter's
      # own "state file missing/unreadable" signal (main.py::_dr_drill_state).
      - alert: ROMADRDrillMetricAbsent
        expr: absent(roma_dr_drill_last_success_timestamp) or roma_dr_drill_last_success_timestamp == 0
        for: 30m
        labels: {severity: warning, category: backup}
        annotations:
          summary: "ROMA DR drill metric missing or zero — drill state is unobservable"
          description: "roma_dr_drill_last_success_timestamp is absent from /metrics or equals 0, so ROMADRDrillStale proves nothing either way. roma-execution-bridge exports 0 when /root/.sealed/pgdump/drill_state.json is missing or unreadable; absent means the metric left the registry. Check the exporter wiring and the state file."
