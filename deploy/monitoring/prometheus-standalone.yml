global:
  evaluation_interval: 15s
  external_labels:
    cluster: astrofin-sentinel
    env: production
  scrape_interval: 15s
remote_write:
- basic_auth:
    password_file: /root/.sealed/prom-gc-basic-auth
    username: '3026458'
  url: https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom/push
  write_relabel_configs:
  - action: keep
    regex: astrofin_.*|pg_.*|pg_exporter_.*|roma_.*
    source_labels:
    - __name__
scrape_configs:
- job_name: astrofin-metrics-exporter
  static_configs:
  - labels:
      service: astrofin-metrics
    targets:
    - localhost:9191
- job_name: evolution-worker
  static_configs:
  - labels:
      service: evolution-worker
    targets:
    - localhost:9192
- job_name: roma-execution-bridge
  scrape_interval: 15s
  static_configs:
  - labels:
      service: roma
    targets:
    - localhost:8900
- job_name: astrofin-prod-strategy
  scrape_interval: 15s
  static_configs:
  - labels:
      service: astrofin-prod-strategy
    targets:
    - localhost:9193

- job_name: prometheus-self
  scrape_interval: 30s
  static_configs:
  - targets:
    - localhost:9090

- job_name: postgres-exporter
  scrape_interval: 15s
  static_configs:
  - targets:
    - localhost:9187
    - localhost:8000

rule_files:
  - /home/workspace/deploy/monitoring/recording-rules.yml
  - /home/workspace/deploy/monitoring/alert_rules.yml

alerting:
  alertmanagers:
    - api_version: v2
      timeout: 10s
      static_configs:
        - targets:
            - 127.0.0.1:9093
