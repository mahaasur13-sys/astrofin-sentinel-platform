<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Warp Test</title>
<style>
body { margin:0; background:#050508; color:#fff; font-family:sans-serif; }
#orbital-canvas { position:fixed; inset:0; z-index:0; }
.btn-warp { display:inline-flex; align-items:center; gap:10px; padding:14px 28px;
  background:linear-gradient(135deg,#06d6d6,#a855f7); color:#000; font-weight:700;
  font-size:1rem; border:none; border-radius:12px; cursor:pointer; margin:40px;
  box-shadow:0 0 30px rgba(6,214,214,0.45); position:relative; z-index:5; }
.video-modal { position:fixed; inset:0; background:#050508; z-index:9999;
  display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; }
.video-modal.active { opacity:1; visibility:visible; }
.video-container { position:relative; width:90vw; aspect-ratio:16/9;
  border:2px solid #06d6d6; border-radius:16px; overflow:hidden;
  box-shadow:0 0 80px rgba(6,214,214,0.35); }
.video-close { position:absolute; top:14px; right:14px; width:44px; height:44px;
  border-radius:50%; background:rgba(0,0,0,0.75); border:1px solid #06d6d6;
  color:#06d6d6; font-size:1.7rem; cursor:pointer; z-index:10; }
.msg { position:relative; z-index:5; padding:10px; background:#111; margin:10px; border-radius:8px; }
</style></head><body>

<canvas id="orbital-canvas"></canvas>

<div class="msg" id="status">🟡 Status: ready — click Watch Demo</div>
<button class="btn-warp" id="watchDemoBtn"><span>▶</span> Watch Demo</button>

<div class="video-modal" id="videoModal">
  <div class="video-container">
    <button class="video-close" id="videoClose">&times;</button>
    <video id="demoVideo" controls playsinline style="width:100%;height:100%;object-fit:cover;background:#000;">
      <source src="demo.mp4" type="video/mp4">
    </video>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('orbital-canvas');
  if (!canvas) { document.getElementById('status').textContent = '❌ FAIL: canvas not found'; return; }
  const ctx = canvas.getContext('2d');
  let w, h, particles = [], baseSpeeds = [], warpMode = false, warpProgress = 0;
  const COLORS = ['#06d6d6', '#a855f7', '#22c55e'];

  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  function createParticles() {
    particles = []; baseSpeeds = [];
    for (let i = 0; i < 40; i++) {
      const p = { x: Math.random()*w, y: Math.random()*h, r: 0.5+Math.random()*2,
        orbitR: 50+Math.random()*180, angle: Math.random()*Math.PI*2,
        speed: 0.005+Math.random()*0.02, color: COLORS[Math.floor(Math.random()*3)], alpha: 0.3 };
      particles.push(p); baseSpeeds.push(p.speed);
    }
  }
  function draw() {
    ctx.clearRect(0,0,w,h);
    particles.forEach((p,i) => {
      if (warpMode) { const dx=w/2-p.x, dy=h/2-p.y; p.x+=dx*0.045*warpProgress; p.y+=dy*0.045*warpProgress; p.speed=baseSpeeds[i]*(3+warpProgress*8); p.orbitR*=0.97; }
      else p.speed = baseSpeeds[i];
      p.angle += p.speed;
      const cx = p.x + Math.cos(p.angle)*p.orbitR*0.55, cy = p.y + Math.sin(p.angle)*p.orbitR*0.32;
      ctx.beginPath(); ctx.arc(cx,cy,p.r,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=p.alpha; ctx.shadowBlur=4; ctx.shadowColor=p.color; ctx.fill(); ctx.shadowBlur=0;
    });
    ctx.globalAlpha=1; requestAnimationFrame(draw);
  }
  window.accelerateParticles = function(factor) {
    warpMode = true; warpProgress = 0;
    const start = performance.now();
    (function anim(now) { warpProgress = Math.min((now-start)/900, 1); if (warpProgress<1) requestAnimationFrame(anim); })(start);
  };
  window.resetParticles = function() { warpMode=false; warpProgress=0; createParticles(); };
  resize(); createParticles(); draw();
  window.addEventListener('resize', () => { resize(); createParticles(); });
})();

(function() {
  const btn = document.getElementById('watchDemoBtn');
  const modal = document.getElementById('videoModal');
  const video = document.getElementById('demoVideo');
  const closeBtn = document.getElementById('videoClose');
  const status = document.getElementById('status');
  let isWarping = false;

  if (!btn) { status.textContent = '❌ FAIL: watchDemoBtn not found'; return; }
  status.textContent = '✅ OK: button found, click handler attached';

  btn.addEventListener('click', function() {
    status.textContent = '🔥 CLICKED! Starting warp...';
    if (isWarping) return;
    isWarping = true;
    window.accelerateParticles(6);
    document.body.style.transition = 'transform 1.1s, filter 1.1s';
    document.body.style.transform = 'scale(1.18)';
    document.body.style.filter = 'brightness(1.4) contrast(1.1)';
    setTimeout(() => { modal.classList.add('active'); status.textContent = '🎬 Video modal opened'; }, 680);
    setTimeout(() => { document.body.style.transform='scale(1)'; document.body.style.filter='none'; window.resetParticles(); isWarping=false; }, 1300);
  });

  closeBtn.addEventListener('click', () => { modal.classList.remove('active'); status.textContent = '🟡 Modal closed'; });
  modal.addEventListener('click', (e) => { if (e.target === modal) { modal.classList.remove('active'); status.textContent = '🟡 Modal closed (overlay)'; } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { modal.classList.remove('active'); status.textContent = '🟡 Modal closed (Escape)'; } });
})();
</script>
</body></html>
